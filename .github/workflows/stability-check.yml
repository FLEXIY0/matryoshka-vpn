name: VPN Stability Check

on:
  schedule:
    # Recheck stable pool every 15 minutes
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'configs/russia_whitelist.txt'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto   # smart: scan every 3h, recheck otherwise
          - scan   # force full scan for new candidates
          - quick  # recheck pool only

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xray-core
        run: |
          XRAY_VER=$(curl -sf "https://api.github.com/repos/XTLS/Xray-core/releases/latest" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          echo "Installing xray ${XRAY_VER}"
          wget -q "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip"
          unzip -q Xray-linux-64.zip xray
          mkdir -p bin && mv xray bin/xray && chmod +x bin/xray

      - name: Run stability checker
        run: |
          MODE="${{ inputs.mode }}"

          if [ "${{ github.event_name }}" = "push" ]; then
            # New whitelist just landed — scan for fresh candidates
            echo "[*] Triggered by whitelist update, running full scan"
            python3 scripts/stability_checker.py --scan

          elif [ "${MODE}" = "scan" ]; then
            python3 scripts/stability_checker.py --scan

          elif [ "${MODE}" = "quick" ]; then
            python3 scripts/stability_checker.py --quick

          else
            # Auto mode: force scan every 3h (at hours 0,3,6,9,12,15,18,21),
            # plain recheck the rest of the time
            HOUR=$(date -u +%-H)
            if [ $((HOUR % 3)) -eq 0 ]; then
              echo "[*] Hour ${HOUR} — forcing full scan"
              python3 scripts/stability_checker.py --scan
            else
              echo "[*] Hour ${HOUR} — rechecking pool"
              python3 scripts/stability_checker.py
            fi
          fi

      - name: Commit stable configs
        run: |
          git config user.name "stability-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs/stable_pool.json configs/stable_top15.txt
          if git diff --staged --quiet; then
            echo "No changes — pool is already up to date."
          else
            git commit -m "chore: update stable configs $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git pull --rebase
            git push
          fi
